name: Streamlit CI-CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  streamlit-check:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Smoke Test Streamlit
        run: |
          # Correction : on lance home_app.py directement depuis la racine
          nohup streamlit run home_app.py & 
          
          # Attente que le serveur démarre
          sleep 15
          
          # Vérification que l'application répond
          curl --fail http://localhost:8501/_stcore/health